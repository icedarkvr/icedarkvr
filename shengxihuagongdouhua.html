<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>汕尾話 ⇄ 廣東話 語音翻譯</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --sw: #c0392b;      /* 汕尾話 紅 */
    --gd: #1e6091;      /* 廣東話 藍 */
    --bg: #f5f6f8;
    --card: #ffffff;
    --txt: #1c1c1e;
    --sub: #8a8a8f;
  }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt);
    min-height:100vh; padding:16px; max-width:560px; margin:0 auto;
  }
  header{ text-align:center; padding:18px 0 8px; }
  header h1{ font-size:22px; }
  header p{ color:var(--sub); font-size:13px; margin-top:6px; }

  /* 方向切換 */
  .dir-box{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin:16px 0;
  }
  .lang-tag{
    padding:8px 18px; border-radius:20px; font-weight:600; font-size:15px;
    color:#fff; min-width:96px; text-align:center;
  }
  .tag-sw{ background:var(--sw); }
  .tag-gd{ background:var(--gd); }
  .swap-btn{
    width:40px; height:40px; border-radius:50%; border:none;
    background:#e5e5ea; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .25s;
  }
  .swap-btn:active{ transform:rotate(180deg) scale(.9); }

  /* 卡片 */
  .card{
    background:var(--card); border-radius:16px; padding:16px;
    margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  .card label{ font-size:13px; color:var(--sub); display:block; margin-bottom:8px; }
  .text-area{
    width:100%; min-height:80px; border:none; outline:none; resize:vertical;
    font-size:19px; line-height:1.6; background:transparent;
  }
  .row2{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .mic-btn{
    flex:1; padding:14px; border:none; border-radius:12px; color:#fff;
    font-size:16px; font-weight:600; cursor:pointer; display:flex;
    align-items:center; justify-content:center; gap:8px;
  }
  .mic-sw{ background:var(--sw); }
  .mic-gd{ background:var(--gd); }
  .mic-btn.listening{ animation:pulse .9s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.55} }
  .speak-btn{
    background:none; border:none; font-size:22px; cursor:pointer; padding:6px;
  }

  /* 翻譯結果 */
  #resultWrap{ display:none; }
  .arrow{ text-align:center; color:var(--sub); margin:2px 0 10px; font-size:13px; }

  .tip{ text-align:center; color:var(--sub); font-size:12px; margin-top:18px; line-height:1.7; }

  /* Toast */
  #toast{
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    background:rgba(28,28,30,.92); color:#fff; padding:12px 20px;
    border-radius:12px; font-size:14px; opacity:0; pointer-events:none;
    transition:opacity .3s; max-width:88vw; text-align:center;
  }
  #toast.show{ opacity:1; }
</style>
</head>
<body>
<header>
  <h1>🗣️ 語音雙向翻譯</h1>
  <p>汕尾話（學佬話）⇄ 廣東話（粵語）</p>
</header>

<div class="dir-box">
  <div class="lang-tag tag-sw" id="fromTag">汕尾話</div>
  <button class="swap-btn" id="swapBtn" title="調換方向">⇄</button>
  <div class="lang-tag tag-gd" id="toTag">廣東話</div>
</div>

<!-- 輸入 -->
<div class="card">
  <label id="inputLabel">講一句汕尾話：</label>
  <textarea class="text-area" id="inputText" placeholder="按下面咪高峰講嘢，或喺度打字…"></textarea>
  <div class="row2">
    <button class="mic-btn" id="micBtn">🎙️ 按住 / 點擊 講嘢</button>
    <button class="speak-btn" id="speakInput" title="朗讀輸入">🔊</button>
  </div>
</div>

<div class="arrow">⬇ 翻譯結果 ⬇</div>

<!-- 輸出 -->
<div class="card" id="resultWrap">
  <label id="outputLabel">廣東話：</label>
  <div class="text-area" id="outputText" style="min-height:60px;"></div>
  <div class="row2">
    <span style="font-size:12px;color:var(--sub)" id="note"></span>
    <button class="speak-btn" id="speakOutput" title="朗讀結果">🔊</button>
  </div>
</div>

<p class="tip">
  💡 貼士：語音辨識用緊瀏覽器內置引擎（請用 Chrome / Safari）。<br>
  汕尾話字詞若無法辨識，可直接打字，App 會做詞典對應翻譯。
</p>

<div id="toast"></div>

<script>
/* ============ 基礎詞典（汕尾話 ⇄ 廣東話） ============ */
// 鍵可為任一方向，翻譯時雙向查找；長句優先匹配
const DICT = [
  // 日常招呼
  ["你好","你好"],
  ["食咗未","食咗未"],
  ["食飽未","食飽未"],
  ["早晨","早晨"],
  ["晚上好","晚上好"],
  ["再見","再見"],
  ["拜拜","拜拜"],
  ["多謝","多謝"],
  ["唔該","唔該"],
  ["對唔住","對唔住"],
  ["冇事","冇事"],
  // 人稱
  ["我","我"],
  ["你","你"],
  ["佢","佢"],
  ["我哋","我哋"],
  ["你哋","你哋"],
  ["佢哋","佢哋"],
  ["阿爸","老豆"],
  ["阿母","老母"],
  ["阿媽","媽咪"],
  ["家後","老婆"],
  ["翁仔","老公"],
  ["囝仔","細路仔"],
  ["查某囝","女仔"],
  ["後生仔","後生仔"],
  // 食嘢
  ["食飯","食飯"],
  ["食粥","食粥"],
  ["食麵","食麵"],
  ["飲茶","飲茶"],
  ["食粿","食粿"],
  ["滾水","熱水"],
  ["凉水","凍水"],
  ["肚餓","肚餓"],
  ["好食","好食"],
  ["唔好食","唔好食"],
  // 常用動詞/形容詞
  ["去邊","去邊度"],
  ["去哪","去邊度"],
  ["喺邊","喺邊度"],
  ["做咩","做咩"],
  ["點解","點解"],
  ["幾多","幾多"],
  ["幾耐","幾耐"],
  ["好齊","好齊"],
  ["靚","靚"],
  ["醜","醜"],
  ["大","大"],
  ["細","細"],
  ["多","多"],
  ["少","少"],
  ["快","快"],
  ["慢","慢"],
  ["熱","熱"],
  ["凍","凍"],
  ["攞","攞"],
  ["畀","畀"],
  ["睇","睇"],
  ["聽","聽"],
  ["講","講"],
  ["行","行"],
  ["企","企"],
  ["坐","坐"],
  ["瞓","瞓"],
  ["識","識"],
  ["唔識","唔識"],
  ["知","知"],
  ["唔知","唔知"],
  ["有","有"],
  ["冇","冇"],
  ["係","係"],
  ["唔係","唔係"],
  // 時間
  ["今仔日","今日"],
  ["明仔日","聽日"],
  ["昨昏","昨日"],
  ["下昏","聽日"],
  ["這陣","而家"],
  ["晏晝","晏晝"],
  // 地點
  ["屋企","屋企"],
  ["公司","公司"],
  ["學堂","學校"],
  ["鋪仔","舖頭"],
  ["街路","街"],
  // 感嘆
  ["實在好","真係好"],
  ["無要緊","唔緊要"],
  ["唔使客氣","唔使客氣"],
];

/* ============ 狀態 ============ */
let fromSW = true; // true: 汕尾話→廣東話 ; false: 廣東話→汕尾話
const $ = id => document.getElementById(id);

/* ============ 翻譯核心 ============ */
function translate(text){
  if(!text.trim()) return {text:"", note:""};
  let out = text;
  // 由長到短匹配，避免短詞先被替換
  const sorted = [...DICT].sort((a,b)=> b[0].length - a[0].length);
  for(const [a,b] of sorted){
    const from = fromSW ? a : b;
    const to   = fromSW ? b : a;
    if(from){ out = out.split(from).join(to); }
  }
  const changed = out !== text;
  return { text:out, note: changed ? "（詞典對應翻譯）" : "⚠️ 未收錄此詞，請手動修改" };
}

function updateResult(){
  const val = $("inputText").value;
  if(!val.trim()){ $("resultWrap").style.display="none"; return; }
  const {text,note} = translate(val);
  $("outputText").textContent = text || "—";
  $("note").textContent = note;
  $("resultWrap").style.display="block";
}

$("inputText").addEventListener("input", updateResult);

/* ============ 方向切換 ============ */
function setDirection(swFirst){
  fromSW = swFirst;
  $("fromTag").className = "lang-tag " + (fromSW?"tag-sw":"tag-gd");
  $("toTag").className   = "lang-tag " + (fromSW?"tag-gd":"tag-sw");
  $("fromTag").textContent = fromSW ? "汕尾話" : "廣東話";
  $("toTag").textContent   = fromSW ? "廣東話" : "汕尾話";
  $("inputLabel").textContent = fromSW ? "講一句汕尾話：" : "講一句廣東話：";
  $("outputLabel").textContent = fromSW ? "廣東話：" : "汕尾話：";
  $("micBtn").className = "mic-btn " + (fromSW?"mic-sw":"mic-gd");
  updateResult();
}
$("swapBtn").addEventListener("click", ()=> setDirection(!fromSW));

/* ============ 語音朗讀（TTS） ============ */
function speak(text, lang){
  if(!window.speechSynthesis){ toast("此瀏覽器唔支援朗讀"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  // 廣東話用 zh-HK，汕尾話冇專用語音，退用普通話 zh-CN 近似
  u.lang = lang === "gd" ? "zh-HK" : "zh-CN";
  u.rate = 0.95;
  speechSynthesis.speak(u);
}
$("speakInput").addEventListener("click", ()=>{
  speak($("inputText").value, fromSW?"sw":"gd");
});
$("speakOutput").addEventListener("click", ()=>{
  speak($("outputText").textContent, fromSW?"gd":"sw");
});

/* ============ 語音辨識（STT） ============ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let listening = false;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove("show"),2200);
}

function startRec(){
  if(!SR){ toast("此瀏覽器唔支援語音輸入，請改用打字或換 Chrome"); return; }
  recognizer = new SR();
  // 輸入方語言：廣東話用 zh-HK；汕尾話用普通話引擎近似接收
  recognizer.lang = fromSW ? "zh-CN" : "zh-HK";
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 3;
  recognizer.onstart = ()=>{ listening=true; $("micBtn").classList.add("listening"); $("micBtn").innerHTML="🛑 聽緊…點擊停"; };
  recognizer.onerror = e=>{ toast("語音錯誤："+e.error); stopRec(); };
  recognizer.onend = ()=>{ stopRec(); };
  recognizer.onresult = e=>{
    let best = e.results[0][0].transcript;
    // 若有多個候選，優先選較長（通常較完整）
    for(let i=0;i<e.results[0].length;i++){
      if(e.results[0][i].transcript.length > best.length) best = e.results[0][i].transcript;
    }
    $("inputText").value = best;
    updateResult();
  };
  try{ recognizer.start(); }catch(err){ toast("無法開啟咪高峰"); }
}

function stopRec(){
  if(recognizer){ try{ recognizer.stop(); }catch(e){} }
  listening=false;
  $("micBtn").classList.remove("listening");
  $("micBtn").innerHTML="🎙️ 按住 / 點擊 講嘢";
}

$("micBtn").addEventListener("click", ()=>{ listening ? stopRec() : startRec(); });

/* 初始化 */
setDirection(true);
</script>
</body>
</html>
